<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>House Price Predictor</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin:0; padding:0; font-family:'Inter', sans-serif; }

body {
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: linear-gradient(135deg,#e0f0ff,#c1d9ff);
  overflow: hidden;
}

/* Soft floating gradients */
.circle {
  position: absolute;
  border-radius: 50%;
  opacity: 0.2;
  filter: blur(80px);
  animation: float 14s ease-in-out infinite;
}
.circle.one { width:300px; height:300px; top:-60px; left:-60px; background: #8ec6ff; }
.circle.two { width:200px; height:200px; bottom:-60px; right:-60px; background: #5da8ff; animation-delay: 7s; }
@keyframes float {
  0% { transform: translateY(0) translateX(0); }
  50% { transform: translateY(-60px) translateX(40px); }
  100% { transform: translateY(0) translateX(0); }
}

/* Main Card */
.card {
  position: relative;
  z-index:2;
  background: #ffffff;
  border-radius: 20px;
  padding: 50px 40px;
  width: 90%;
  max-width: 500px;
  text-align: center;
  box-shadow: 0 10px 30px rgba(0,0,0,0.1);
  transition: transform 0.3s;
}
.card:hover { transform: translateY(-5px); }

h1 {
  font-size:2rem; color:#1a73e8; margin-bottom:30px;
}

label {
  display:block;
  margin-top:15px;
  color:#333;
  font-weight:500;
  text-align:left;
}

input, select {
  width:100%; padding:12px; margin-top:5px; border-radius:8px;
  border:1px solid #ccc; outline:none;
  font-weight:500;
  transition: 0.3s, transform 0.2s ease-in-out;
}
input:hover, select:hover { transform: scale(1.02); }
input:focus, select:focus { border-color:#1a73e8; box-shadow: 0 0 8px rgba(26,115,232,0.3); }

button {
  width:100%; padding:14px; margin-top:25px; border:none;
  border-radius:10px; font-weight:600;
  background: linear-gradient(135deg,#1a73e8,#4285f4);
  color:#fff; cursor:pointer;
  transition: 0.3s, transform 0.2s ease-in-out;
}
button:hover { transform: scale(1.05); box-shadow: 0 5px 20px rgba(26,115,232,0.3); }

/* Result */
.result {
  margin-top:25px; padding:20px; border-radius:12px;
  background: #f1f8ff; color:#1a73e8;
  font-weight:600; font-size:1.4rem; opacity:0;
  transform: translateY(20px);
  transition: all 0.6s ease;
}
.result.show { opacity:1; transform:translateY(0);}
.result .price { font-size:1.8rem; margin-bottom:8px; }
.result .score { font-size:1rem; color:#555;}
</style>
</head>
<body>

<div class="circle one"></div>
<div class="circle two"></div>

<div class="card">
  <h1>🏠 House Price Predictor</h1>
  <form id="predictForm">
    <label>Area (sq ft)</label>
    <input type="number" id="area" required>
    <label>Bedrooms</label>
    <input type="number" id="bedroom" required>
    <label>Bathrooms</label>
    <input type="number" id="bathroom" required>
    <label>Furnishing Status</label>
    <select id="furnish">
      <option value="1">Unfurnished</option>
      <option value="2">Semi-Furnished</option>
      <option value="3">Furnished</option>
    </select>
    <label>Algorithm</label>
    <select id="algo">
      <option value="0">Linear Regression</option>
      <option value="1">Decision Tree</option>
      <option value="2">Random Forest</option>
      <option value="3">SVR</option>
    </select>
    <button type="submit">Predict Price</button>
  </form>

  <div class="result" id="result">
    <div class="price" id="predPrice"></div>
    <div class="score" id="predScore"></div>
  </div>
</div>

<script>
const form = document.getElementById('predictForm');
const resultDiv = document.getElementById('result');
const priceEl = document.getElementById('predPrice');
const scoreEl = document.getElementById('predScore');

form.addEventListener('submit', function(e){
  e.preventDefault();
  const area = parseFloat(document.getElementById('area').value);
  const bedroom = parseInt(document.getElementById('bedroom').value);
  const bathroom = parseInt(document.getElementById('bathroom').value);

  const price = area*2200 + bedroom*55000 + bathroom*35000;
  const mse = (0.75 + Math.random()*0.2).toFixed(2);

  // Count-up animation
  let current = 0;
  priceEl.innerText = "₹ 0";
  let step = Math.ceil(price/50);
  let counter = setInterval(()=>{
    current += step;
    if(current>=price){ current=price; clearInterval(counter);}
    priceEl.innerText = "₹ " + current.toLocaleString("en-IN");
  }, 20);

  
  resultDiv.classList.add('show');
});
</script>

</body>
</html>

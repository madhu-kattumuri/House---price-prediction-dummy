<!DOCTYPE html>
<html>
<head>
    <title>House Price Predictor</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial;
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url("{{ url_for('static', filename='houseproj.jpg') }}");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .box {
            background: white;
            padding: 30px;
            border-radius: 15px;
            width: 400px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        h1 { color: #007bff; text-align: center; }
        input, select {
            width: 100%;
            padding: 12px;
            margin: 8px 0 15px 0;
            border-radius: 8px;
            border: 1px solid #ccc;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 13px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }
        .result {
            margin-top: 20px;
            background: #e8f0fe;
            padding: 15px;
            text-align: center;
            border-radius: 10px;
            font-size: 22px;
            font-weight: bold;
            color: #007bff;
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>🏠 House Price Predictor</h1>
        <form method="POST">
            <label>Area (sq ft)</label>
            <input type="number" name="area" min="100" max="10000" required placeholder="Ex: 1200">
            
            <label>Bedrooms</label>
            <input type="number" name="bedroom" min="1" max="10" required placeholder="Ex: 2">
            
            <label>Bathrooms</label>
            <input type="number" name="bathroom" min="1" max="10" required placeholder="Ex: 2">
            
            <label>Furnishing Status</label>
            <select name="furnish">
                <option value="0">Unfurnished</option>
                <option value="1">Semi-Furnished</option>
                <option value="2">Furnished</option>
            </select>

            <label>Algorithm</label>
            <select name="algo">
                <option value="1">Linear Regression</option>
                <option value="2">Decision Tree</option>
                <option value="3">Random Forest</option>
                <option value="4">SVR</option>
            </select>

            <button type="submit">Predict Price</button>
        </form>

        {% if pred %}
        <div class="result">₹ {{ "%.2f"|format(pred) }} /- Lakhs</div>
        {% endif %}
        {% if mse %}
        <p style="text-align:center; font-size:13px;">MSE: {{ mse }}</p>
        {% endif %}
    </div>
</body>
</html>
